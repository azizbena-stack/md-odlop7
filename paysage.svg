  <path fill="#C4AEC9" d="M0 470 L40 440 L75 455 L120 410 L160 445 L200 425 L235 455 L290 405 L340 450 L370 432 L400 448 V700 H0Z"/>
  <path fill="url(#brume)" d="M0 440 H400 V520 H0Z"/>
  <!-- collines -->
  <path fill="#A08FAF" d="M0 505 C40 485 70 492 105 478 C150 462 180 490 225 482 C270 474 300 452 340 470 C365 480 385 476 400 470 V700 H0Z"/>
  <path fill="url(#brume)" opacity=".6" d="M0 480 H400 V560 H0Z"/>
