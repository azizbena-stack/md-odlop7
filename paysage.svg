  <path fill="#6E8C89" d="M0 548 q10-14 20-4 q8-16 20-6 q10-12 22-2 q9-15 22-4 q12-12 22 0 q10-16 24-5 q8-10 20-1 q11-15 24-4 q10-12 22-1 q9-14 22-3 q12-13 24 0 q10-12 20-2 q9-15 22-4 q10-11 20 0 q8-12 20-3 q10-10 20 2 V700 H0Z"/>
