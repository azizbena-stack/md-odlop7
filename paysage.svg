  <path fill="#22413B" d="M0 640 q20-26 44-8 q18-20 40-2 q22-24 46-4 q20-18 42 0 q22-26 48-6 q20-16 40 2 q22-22 46-4 q22-18 46 2 q20-14 48 4 V700 H0Z"/>
</svg>
