<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice">
  <!-- Décor du thème « Paysage » : lever de soleil, montagnes et forêt en couches (dessiné pour Repère) -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9A7CF"/><stop offset=".38" stop-color="#E9C6C2"/><stop offset=".6" stop-color="#F8DDBE"/><stop offset=".75" stop-color="#FCEBD0"/>
    </linearGradient>
    <radialGradient id="halo" cx="270" cy="430" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6E3" stop-opacity=".95"/><stop offset=".25" stop-color="#FFE9C7" stop-opacity=".6"/><stop offset="1" stop-color="#FFE9C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brume" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E1D3" stop-opacity="0"/><stop offset="1" stop-color="#F6E1D3" stop-opacity=".75"/></linearGradient>
  </defs>
  <rect width="400" height="700" fill="url(#ciel)"/>
  <circle cx="270" cy="430" r="150" fill="url(#halo)"/>
  <circle cx="270" cy="430" r="22" fill="#FFF8EA"/>
  <!-- nuages -->
  <g fill="#F3D2C6" opacity=".7">
    <ellipse cx="90" cy="300" rx="70" ry="9"/><ellipse cx="130" cy="290" rx="40" ry="8"/>
    <ellipse cx="330" cy="340" rx="60" ry="7"/><ellipse cx="300" cy="332" rx="30" ry="6"/>
  </g>
