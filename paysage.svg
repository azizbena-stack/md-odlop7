  <path fill="#3F6B60" d="M0 590 q14-22 30-6 q10-24 30-8 q14-18 30-2 q12-22 32-6 q16-20 30 0 q12-24 32-8 q12-16 28 0 q14-22 32-6 q12-18 28-2 q14-24 32-6 q14-16 28 2 q10-20 26-8 q10-12 22 4 V700 H0Z"/>
